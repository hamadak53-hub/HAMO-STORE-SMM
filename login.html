<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18"><title>تسجيل الدخول | HAMO STORE SMM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 10%,#172c52 0,transparent 42%),#080d18;color:#f4f7ff;font-family:Cairo,sans-serif}
.card{width:min(100%,460px);padding:32px;border:1px solid #263958;border-radius:24px;background:#101a2b;box-shadow:0 24px 80px #0008}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#19c6bd,#6475ff);font-size:25px;font-weight:900}.brand b{font-size:21px}.brand small{display:block;color:#8da4c8;font-size:10px;letter-spacing:2px}
h1{font-size:27px;margin:0 0 5px}.sub{color:#9aabc5;margin:0 0 24px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1;background:#17253a;color:#a9bad4;border:1px solid #2b3e5d;padding:11px;border-radius:12px;font:700 14px Cairo;cursor:pointer}.tabs button.active{background:#1d3a53;color:#fff;border-color:#25bcb6}
label{display:block;margin:13px 0 6px;color:#c8d5e9;font-size:13px}input{width:100%;padding:13px 14px;border:1px solid #30435f;border-radius:11px;background:#0b1422;color:white;font:14px Cairo;outline:none}input:focus{border-color:#26c5bd}
.submit{width:100%;margin-top:22px;padding:13px;border:0;border-radius:12px;background:linear-gradient(100deg,#16bdb4,#5969ee);color:white;font:800 15px Cairo;cursor:pointer}.msg{min-height:25px;color:#ffb9a8;font-size:13px;margin-top:10px}.hint{color:#8498b7;text-align:center;font-size:12px;margin-top:16px}
</style></head>
<body><main class="card"><div class="brand"><div class="mark">H</div><div><b>HAMO STORE</b><small>SOCIAL MEDIA SERVICES</small></div></div>
<h1 id="heading">أهلاً بيك من جديد</h1><p class="sub">سجّل دخولك للوصول إلى المتجر وخدماتك ومحفظتك.</p>
<div class="tabs"><button type="button" id="loginTab" class="active">تسجيل الدخول</button><button type="button" id="registerTab">إنشاء حساب</button></div>
<form id="authForm"><div id="nameWrap" hidden><label>الاسم بالكامل</label><input name="name" minlength="2" maxlength="100" autocomplete="name"></div>
<div id="phoneWrap" hidden><label>رقم الموبايل (اختياري)</label><input name="phone" maxlength="40" autocomplete="tel"></div>
<label>البريد الإلكتروني</label><input name="email" type="email" required autocomplete="email">
<label>كلمة المرور</label><input name="password" type="password" required minlength="8" autocomplete="current-password">
<button class="submit" id="submitBtn">تسجيل الدخول</button><p class="msg" id="message" role="status"></p></form>
<p class="hint">حسابك ومحفظتك وطلباتك في مكان واحد.</p></main><script src="/login.js"></script></body></html>
